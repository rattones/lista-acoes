# Cabeçalhos de segurança comuns a todos os subdomínios (incluído só nos servers HTTPS).
# Atenção: add_header dentro de um location anula os do server; mantenha-os no server.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
# HSTS (tarefa 006): navegadores passam a usar só HTTPS por 1 ano, inclusive nos subdomínios.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

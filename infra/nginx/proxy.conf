# Proxy de PROD (tarefas 005 e 006): único container com portas publicadas no host.
# Roteia por subdomínio: api. → backend, app. → frontend (SPA), www. e raiz → frontend (landing).
# HTTP só atende o desafio da Let's Encrypt e redireciona o resto para o HTTPS.
server_tokens off;

# DNS interno do Docker, consultado a cada 10 s: o proxy sobe mesmo com um serviço
# fora do ar e acompanha a troca de IP quando um container é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

log_format principal '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                     '$request_time "$http_user_agent" id=$request_id';
access_log /dev/stdout principal;

# Certificado da Let's Encrypt (um só, com os quatro nomes), renovado pelo serviço certbot.
ssl_certificate /etc/letsencrypt/live/listadecompras.net/fullchain.pem;
ssl_certificate_key /etc/letsencrypt/live/listadecompras.net/privkey.pem;
ssl_protocols TLSv1.2 TLSv1.3;
ssl_prefer_server_ciphers off;
ssl_session_cache shared:SSL:10m;
ssl_session_timeout 1d;
ssl_session_tickets off;

# --- HTTP (80) ---

# Host desconhecido (ou acesso pelo IP): fecha a conexão sem resposta.
server {
  listen 80 default_server;
  server_name _;
  return 444;
}

server {
  listen 80;
  server_name api.listadecompras.net app.listadecompras.net www.listadecompras.net listadecompras.net;

  # Desafio HTTP-01 da Let's Encrypt (emissão e renovação).
  location /.well-known/acme-challenge/ {
    root /var/www/certbot;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

# Healthcheck do container (só dentro dele, não publicado).
server {
  listen 127.0.0.1:8090;
  location = /saude {
    access_log off;
    return 200 "ok\n";
  }
}

# --- HTTPS (443) ---

# Host desconhecido: recusa o handshake TLS (não entrega o certificado).
server {
  listen 443 ssl default_server;
  ssl_reject_handshake on;
}

# API — api.listadecompras.net
server {
  listen 443 ssl;
  http2 on;
  server_name api.listadecompras.net;
  client_max_body_size 1m;

  include /etc/nginx/snippets/seguranca.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

  location / {
    set $upstream http://backend:3000;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-cabecalhos.conf;
    proxy_hide_header X-Powered-By;
  }
}

# App (SPA) — app.listadecompras.net
server {
  listen 443 ssl;
  http2 on;
  server_name app.listadecompras.net;

  include /etc/nginx/snippets/seguranca.conf;
  # Vuetify injeta o tema em <style>: style-src precisa de 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.listadecompras.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    set $upstream http://frontend:8080;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-cabecalhos.conf;
  }
}

# Landing page — www.listadecompras.net e domínio raiz
server {
  listen 443 ssl;
  http2 on;
  server_name www.listadecompras.net listadecompras.net;

  include /etc/nginx/snippets/seguranca.conf;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    set $upstream http://frontend:8081;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-cabecalhos.conf;
  }
}

# Proxy de PROD (tarefa 005): único container com porta publicada no host.
# Roteia por subdomínio: api. → backend, app. → frontend (SPA), www. e raiz → frontend (landing).
server_tokens off;

# DNS interno do Docker, consultado a cada 10 s: o proxy sobe mesmo com um serviço
# fora do ar e acompanha a troca de IP quando um container é recriado.
resolver 127.0.0.11 valid=10s ipv6=off;

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/css text/plain application/javascript application/json image/svg+xml;

log_format principal '$remote_addr [$time_local] "$host" "$request" $status $body_bytes_sent '
                     '$request_time "$http_user_agent" id=$request_id';
access_log /dev/stdout principal;

# Host desconhecido (ou acesso pelo IP): fecha a conexão sem resposta.
server {
  listen 8080 default_server;
  server_name _;
  return 444;
}

# API — api.listadecompras.net
server {
  listen 8080;
  server_name api.listadecompras.net;
  client_max_body_size 1m;

  include /etc/nginx/snippets/seguranca.conf;
  add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

  location / {
    set $upstream http://backend:3000;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-cabecalhos.conf;
    proxy_hide_header X-Powered-By;
  }
}

# App (SPA) — app.listadecompras.net
server {
  listen 8080;
  server_name app.listadecompras.net;

  include /etc/nginx/snippets/seguranca.conf;
  # Vuetify injeta o tema em <style>: style-src precisa de 'unsafe-inline'.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' https://api.listadecompras.net; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    set $upstream http://frontend:8080;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-cabecalhos.conf;
  }
}

# Landing page — www.listadecompras.net e domínio raiz
server {
  listen 8080;
  server_name www.listadecompras.net listadecompras.net;

  include /etc/nginx/snippets/seguranca.conf;
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

  location / {
    set $upstream http://frontend:8081;
    proxy_pass $upstream;
    include /etc/nginx/snippets/proxy-cabecalhos.conf;
  }
}

# Nginx do container frontend (tarefa 005). Só é acessado pelo proxy, na rede interna.
# Compressão e cabeçalhos de segurança ficam no proxy (infra/nginx/proxy.conf).
server_tokens off;

# App (SPA) — app.listadecompras.net
server {
  listen 8080;
  root /usr/share/nginx/app;

  # Assets com hash no nome: nunca mudam, cache longo.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Rotas da SPA caem no index.html, que sempre é revalidado.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}

# Landing page — www.listadecompras.net e domínio raiz
server {
  listen 8081;
  root /usr/share/nginx/landing;

  # Destaques dos agentes (tarefa 034): a página inclui o trecho gerado pelo CLI do banco num
  # volume (destaques.html). Sem o arquivo, a inclusão some sem erro na página.
  ssi on;
  ssi_silent_errors on;

  location /destaques/ {
    internal;
    alias /usr/share/nginx/destaques/;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}

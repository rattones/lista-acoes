# Stack de PROD na VPS (tarefa 005). Uso (na raiz do repositório):
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# Somente o proxy publica porta no host (PROXY_PORTA, padrão 80); backend e
# frontend ficam na rede interna. O proxy roteia por subdomínio:
#   api.listadecompras.net → backend · app. → app · www. e raiz → landing
name: lista-acoes

services:
  proxy:
    image: nginxinc/nginx-unprivileged:1.29-alpine
    restart: unless-stopped
    ports:
      - '${PROXY_PORTA:-80}:8080'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      # O default_server devolve 444; o health vem do host da API.
      test:
        [
          'CMD',
          'wget',
          '-q',
          '-O',
          '/dev/null',
          '--header',
          'Host: api.listadecompras.net',
          'http://127.0.0.1:8080/v1/health',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    image: lista-acoes-backend
    restart: unless-stopped
    init: true
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGENS: ${CORS_ORIGENS:-https://app.listadecompras.net}
    volumes:
      - dados:/app/backend/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.listadecompras.net}
        VITE_APP_URL: ${VITE_APP_URL:-https://app.listadecompras.net}
    image: lista-acoes-frontend
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Banco SQLite de PROD. Não apague: `down -v` remove os dados (backup: tarefa 028).
  dados:

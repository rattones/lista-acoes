# Stack de PROD na VPS (tarefas 005 e 006). Uso (na raiz do repositório):
#   docker compose -f infra/docker-compose.prod.yml up -d --build
# Antes da primeira subida, emita o certificado: infra/scripts/certificado-inicial.sh
# Somente o proxy publica portas no host (PROXY_PORTA 80 e PROXY_PORTA_HTTPS 443);
# os demais serviços ficam na rede interna. O proxy roteia por subdomínio:
#   api.listadecompras.net → backend · app. → app · www. e raiz → landing
name: lista-acoes

services:
  proxy:
    # Imagem oficial (mestre como root): lê a chave da Let's Encrypt, que o certbot
    # grava só para root, e abre as portas 80 e 443; os workers rodam como nginx.
    image: nginx:1.29-alpine
    restart: unless-stopped
    ports:
      - '${PROXY_PORTA:-80}:80'
      - '${PROXY_PORTA_HTTPS:-443}:443'
    volumes:
      - ./nginx/proxy.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - letsencrypt:/etc/letsencrypt:ro
      - acme:/var/www/certbot:ro
    # Recarrega o Nginx a cada 6 h para pegar o certificado renovado pelo certbot.
    command:
      - /bin/sh
      - -c
      - 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8090/saude']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Renova o certificado da Let's Encrypt (desafio HTTP-01 pelo webroot servido no proxy).
  # A emissão inicial é feita por infra/scripts/certificado-inicial.sh.
  certbot:
    image: certbot/certbot:v5.8.0
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - acme:/var/www/certbot
    entrypoint:
      - /bin/sh
      - -c
      - 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot --quiet; sleep 12h & wait $${!}; done'

  # Somente testes (perfil "teste"): certificado autoassinado com os quatro nomes.
  # Uso: docker compose -f infra/docker-compose.prod.yml --profile teste run --rm certificado-teste
  certificado-teste:
    image: alpine/openssl:3.5.9
    profiles: [teste]
    volumes:
      - letsencrypt:/etc/letsencrypt
      - ./scripts/certificado-teste.sh:/certificado-teste.sh:ro
    entrypoint: ['/bin/sh', '/certificado-teste.sh']

  backend:
    build:
      context: ..
      dockerfile: infra/docker/backend.Dockerfile
    image: lista-acoes-backend
    restart: unless-stopped
    init: true
    env_file:
      - path: ../backend/.env
        required: false
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGENS: ${CORS_ORIGENS:-https://app.listadecompras.net}
    volumes:
      - dados:/app/backend/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://localhost:3000/v1/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ..
      dockerfile: infra/docker/frontend.Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://api.listadecompras.net}
        VITE_APP_URL: ${VITE_APP_URL:-https://app.listadecompras.net}
    image: lista-acoes-frontend
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8080/']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  # Banco SQLite de PROD. Não apague: `down -v` remove os dados (backup: tarefa 028).
  dados:
  # Certificados e contas da Let's Encrypt (`down -v` também os apaga).
  letsencrypt:
  # Arquivos do desafio HTTP-01 (temporários).
  acme:

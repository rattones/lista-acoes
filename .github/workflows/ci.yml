# CI (tarefa 007): lint, testes e build a cada push e pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Um push novo na mesma branch/PR cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint e estrutura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:estrutura

  backend:
    name: Testes do backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w backend
      - run: npm run build -w backend
      # Código comum e agentes coletores (tarefa 035), também em Node.
      - run: npm test -w comum -w agentes

  frontend:
    name: Testes e build do frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test -w frontend
      - run: npm run build -w frontend

  # Valida os Dockerfiles de PROD (sem push) e sobe a stack para o smoke test.
  docker:
    name: Imagens e smoke de PROD
    runs-on: ubuntu-latest
    env:
      PROXY_PORTA: 8088
      PROXY_PORTA_HTTPS: 8443
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      # Segredos descartáveis só para o smoke (em PROD vêm do backend/.env da VPS).
      # O SMTP fictício nunca é usado: o smoke não envia e-mails.
      - run: |
          {
            echo "JWT_SEGREDO=$(openssl rand -base64 48)"
            echo "SMTP_USER=ci@example.com"
            echo "SMTP_PASS=ci"
            echo "MAIL_FROM=ci@example.com"
          } > backend/.env
      # API keys fictícias: no smoke os agentes só sobem e agendam, sem chamar a API.
      - run: |
          {
            echo "API_KEY_PRECOS=la_00000000_$(openssl rand -hex 16)"
            echo "API_KEY_NOTICIAS=la_00000001_$(openssl rand -hex 16)"
          } > agentes/.env
      - run: docker compose -f infra/docker-compose.prod.yml build
      # Certificado autoassinado com os nomes de PROD (o real vem da Let's Encrypt na VPS).
      - run: docker compose -f infra/docker-compose.prod.yml --profile teste run --rm certificado-teste
      - run: docker compose -f infra/docker-compose.prod.yml up -d --wait --wait-timeout 120
      - run: npm run smoke:prod
      - name: Logs da stack (em caso de falha)
        if: failure()
        run: docker compose -f infra/docker-compose.prod.yml logs --no-color
      - if: always()
        run: docker compose -f infra/docker-compose.prod.yml down -v
